
name: Build Glue Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          FILE=$(find . -name settings.gradle.kts \
            -not -path './.gradle/*' \
            -print -quit)

          if [ -z "$FILE" ]; then
            FILE=$(find . -name settings.gradle \
              -not -path './.gradle/*' \
              -print -quit)
          fi

          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle(.kts) belum ada!"
            echo "Buat file Gradle project terlebih dahulu."
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: gradle --no-daemon -p "${{ steps.project.outputs.dir }}" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glue-Launcher-V0.1
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
