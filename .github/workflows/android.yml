
name: Build Glue Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/glue/launcher

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GlueLauncher"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.glue.launcher"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.glue.launcher"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Glue Launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/glue/launcher/MainActivity.kt <<'EOF'
          package com.glue.launcher

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this)
                  layout.orientation = LinearLayout.VERTICAL
                  layout.setPadding(28, 48, 28, 28)
                  layout.setBackgroundColor(Color.rgb(18, 20, 32))

                  val title = TextView(this)
                  title.text = "GLUE LAUNCHER"
                  title.textSize = 28f
                  title.setTextColor(Color.WHITE)

                  val subtitle = TextView(this)
                  subtitle.text = "Minecraft Java Launcher V0.1"
                  subtitle.textSize = 16f
                  subtitle.setTextColor(Color.LTGRAY)

                  layout.addView(title)
                  layout.addView(subtitle)
                  setContentView(layout)
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glue-Launcher-V0.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
